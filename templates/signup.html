<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — SmartDoc AI</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0d0f12;
            --bg2: #13161b;
            --bg3: #1a1e26;
            --bg4: #1f232e;
            --border: #ffffff12;
            --border2: #ffffff22;
            --text: #f0f2f8;
            --text2: #8b92a5;
            --text3: #555d70;
            --accent: #6c8fff;
            --accent2: #4c6fff;
            --accent-glow: rgba(108, 143, 255, 0.15);
            --red: #f87171;
            --green: #4ade80;
            --radius: 12px;
            --radius-sm: 8px;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Sora', sans-serif;
            font-size: 14px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: -160px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(108, 143, 255, 0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
            text-decoration: none;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            background: var(--accent);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon svg {
            width: 18px;
            height: 18px;
            fill: #fff;
        }

        .logo-text {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.4px;
            color: var(--text);
        }

        .logo-text span {
            color: var(--accent);
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: 18px;
            padding: 32px 28px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.4px;
            margin-bottom: 4px;
        }

        .card-sub {
            font-size: 13px;
            color: var(--text2);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text2);
            margin-bottom: 6px;
            letter-spacing: 0.2px;
        }

        .input-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg3);
            border: 1px solid var(--border2);
            border-radius: var(--radius-sm);
            padding: 0 14px;
            transition: border-color 0.2s, background 0.2s;
        }

        .input-wrap:focus-within {
            border-color: rgba(108, 143, 255, 0.5);
            background: var(--bg4);
        }

        .input-wrap.error-field {
            border-color: rgba(248, 113, 113, 0.45);
        }

        .input-wrap i {
            font-size: 16px;
            color: var(--text3);
            flex-shrink: 0;
        }

        .input-wrap input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-family: 'Sora', sans-serif;
            font-size: 13.5px;
            padding: 12px 0;
        }

        .input-wrap input::placeholder {
            color: var(--text3);
        }

        .toggle-pw {
            cursor: pointer;
            color: var(--text3);
            font-size: 16px;
            transition: color 0.15s;
            flex-shrink: 0;
        }

        .toggle-pw:hover {
            color: var(--text2);
        }

        /* Password strength bar */
        .pw-strength {
            margin-top: 8px;
        }

        .pw-bar-track {
            height: 3px;
            background: var(--bg4);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .pw-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 3px;
            transition: width 0.3s, background 0.3s;
            background: var(--text3);
        }

        .pw-label {
            font-size: 11px;
            color: var(--text3);
            font-family: 'JetBrains Mono', monospace;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            font-family: 'Sora', sans-serif;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }

        .submit-btn:hover {
            background: var(--accent2);
        }

        .submit-btn:active {
            transform: scale(0.99);
        }

        .submit-btn i {
            font-size: 16px;
        }

        .flash {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 13px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            margin-top: 16px;
        }

        .flash.error {
            background: rgba(248, 113, 113, 0.08);
            border: 1px solid rgba(248, 113, 113, 0.22);
            color: var(--red);
        }

        .flash.success {
            background: rgba(74, 222, 128, 0.08);
            border: 1px solid rgba(74, 222, 128, 0.22);
            color: var(--green);
        }

        .flash i {
            font-size: 15px;
            flex-shrink: 0;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0;
            color: var(--text3);
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .footer-link {
            text-align: center;
            font-size: 13px;
            color: var(--text2);
            margin-top: 22px;
        }

        .footer-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.15s;
        }

        .footer-link a:hover {
            opacity: 0.8;
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: var(--text3);
            text-decoration: none;
            margin-top: 24px;
            transition: color 0.15s;
        }

        .back-link:hover {
            color: var(--text2);
        }

        .back-link i {
            font-size: 14px;
        }

        /* Terms note */
        .terms-note {
            font-size: 11.5px;
            color: var(--text3);
            text-align: center;
            margin-top: 14px;
            line-height: 1.6;
        }

        .terms-note a {
            color: var(--text2);
            text-decoration: none;
        }

        .terms-note a:hover {
            color: var(--text);
        }
    </style>
</head>

<body>

    <div class="page">

        <a href="/" class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 20 20">
                    <path d="M3 4h14v2H3V4zm0 5h14v2H3V9zm0 5h8v2H3v-2z" />
                </svg>
            </div>
            <span class="logo-text">Smart<span>Doc</span> AI</span>
        </a>

        <div class="card">
            <div class="card-title">Create your account</div>
            <div class="card-sub">Start chatting with your documents in seconds</div>

            <form method="POST" id="signup-form">

                <!-- Username -->
                <div class="field">
                    <label for="username">Username</label>
                    <div class="input-wrap">
                        <i class="ti ti-user"></i>
                        <input type="text" name="username" id="username" placeholder="Choose a username" required>
                    </div>
                </div>

                <!-- Email -->
                <div class="field">
                    <label for="email">Email address</label>
                    <div class="input-wrap">
                        <i class="ti ti-mail"></i>
                        <input type="email" name="email" id="email" placeholder="you@example.com" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="field">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <i class="ti ti-lock"></i>
                        <input type="password" name="password" id="password" placeholder="Create a strong password"
                            required oninput="checkStrength(this.value)">
                        <i class="ti ti-eye toggle-pw" id="toggle-pw" onclick="togglePw()"
                            title="Show/hide password"></i>
                    </div>
                    <div class="pw-strength">
                        <div class="pw-bar-track">
                            <div class="pw-bar-fill" id="pw-bar"></div>
                        </div>
                        <div class="pw-label" id="pw-label">Enter a password</div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="ti ti-user-plus"></i> Create Account
                </button>

            </form>

            {% if message %}
            <div
                class="flash {% if 'success' in message.lower() or 'created' in message.lower() or 'welcome' in message.lower() %}success{% else %}error{% endif %}">
                <i
                    class="ti ti-{% if 'success' in message.lower() or 'created' in message.lower() or 'welcome' in message.lower() %}circle-check{% else %}alert-circle{% endif %}"></i>
                {{ message }}
            </div>
            {% endif %}

            <div class="terms-note">
                By creating an account you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy
                    Policy</a>.
            </div>

            <div class="divider">or</div>

            <div class="footer-link">
                Already have an account? <a href="/login">Login</a>
            </div>
        </div>

        <a href="/" class="back-link">
            <i class="ti ti-arrow-left"></i> Back to home
        </a>

    </div>

    <script>
        function togglePw() {
            const inp = document.getElementById('password');
            const icon = document.getElementById('toggle-pw');
            if (inp.type === 'password') {
                inp.type = 'text';
                icon.classList.replace('ti-eye', 'ti-eye-off');
            } else {
                inp.type = 'password';
                icon.classList.replace('ti-eye-off', 'ti-eye');
            }
        }

        function checkStrength(val) {
            const bar = document.getElementById('pw-bar');
            const label = document.getElementById('pw-label');
            if (!val) {
                bar.style.width = '0%'; bar.style.background = 'var(--text3)';
                label.style.color = 'var(--text3)'; label.textContent = 'Enter a password';
                return;
            }
            let score = 0;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;
            const levels = [
                { w: '20%', color: '#f87171', text: 'Weak' },
                { w: '45%', color: '#fbbf24', text: 'Fair' },
                { w: '70%', color: '#60a5fa', text: 'Good' },
                { w: '100%', color: '#4ade80', text: 'Strong' },
            ];
            const l = levels[score - 1] || levels[0];
            bar.style.width = l.w;
            bar.style.background = l.color;
            label.style.color = l.color;
            label.textContent = l.text;
        }
    </script>

</body>

</html>
