<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — SmartDoc AI</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="page">

        <a href="/" class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 20 20">
                    <path d="M3 4h14v2H3V4zm0 5h14v2H3V9zm0 5h8v2H3v-2z" />
                </svg>
            </div>
            <span class="logo-text">Smart<span>Doc</span> AI</span>
        </a>

        <div class="card">
            <div class="card-title">Create your account</div>
            <div class="card-sub">Start chatting with your documents in seconds</div>

            <form method="POST" id="signup-form">

                <!-- Username -->
                <div class="field">
                    <label for="username">Username</label>
                    <div class="input-wrap">
                        <i class="ti ti-user"></i>
                        <input type="text" name="username" id="username" placeholder="Choose a username" required>
                    </div>
                </div>

                <!-- Email -->
                <div class="field">
                    <label for="email">Email address</label>
                    <div class="input-wrap">
                        <i class="ti ti-mail"></i>
                        <input type="email" name="email" id="email" placeholder="you@example.com" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="field">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <i class="ti ti-lock"></i>
                        <input type="password" name="password" id="password" placeholder="Create a strong password"
                            required oninput="checkStrength(this.value)">
                        <i class="ti ti-eye toggle-pw" id="toggle-pw" onclick="togglePw()"
                            title="Show/hide password"></i>
                    </div>
                    <div class="pw-strength">
                        <div class="pw-bar-track">
                            <div class="pw-bar-fill" id="pw-bar"></div>
                        </div>
                        <div class="pw-label" id="pw-label">Enter a password</div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="ti ti-user-plus"></i> Create Account
                </button>

            </form>

            {% if message %}
            <div
                class="flash {% if 'success' in message.lower() or 'created' in message.lower() or 'welcome' in message.lower() %}success{% else %}error{% endif %}">
                <i
                    class="ti ti-{% if 'success' in message.lower() or 'created' in message.lower() or 'welcome' in message.lower() %}circle-check{% else %}alert-circle{% endif %}"></i>
                {{ message }}
            </div>
            {% endif %}

            <div class="terms-note">
                By creating an account you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy
                    Policy</a>.
            </div>

            <div class="divider">or</div>

            <div class="footer-link">
                Already have an account? <a href="/login">Login</a>
            </div>
        </div>

        <a href="/" class="back-link">
            <i class="ti ti-arrow-left"></i> Back to home
        </a>

    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
